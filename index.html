<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Contacto Seguro - Cloudflare Turnstile</title>
  <!-- Script oficial de Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
    }
    h2 {
      margin-top: 0;
      color: #2c3e50;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #34495e;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .cf-turnstile {
      margin: 1.2rem 0;
      display: flex;
      justify-content: center;
    }
    button {
      width: 100%;
      padding: 0.85rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    #mensaje-estado {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Registro de Consulta</h2>
  <form id="miFormulario">
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez" required>
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" name="correo" placeholder="ana@ejemplo.com" required>
    </div>

    <div class="form-group">
      <label for="motivo">Motivo de contacto</label>
      <select id="motivo" name="motivo" required>
        <option value="">Selecciona una opción...</option>
        <option value="soporte">Soporte Técnico</option>
        <option value="ventas">Información de Servicios</option>
        <option value="otro">Otro</option>
      </select>
    </div>

    <div class="form-group">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="3" placeholder="Escribe tu consulta aquí..." required></textarea>
    </div>

    <!-- Widget de Cloudflare Turnstile -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAGGK6m9-Aof-jV1O" data-theme="light" data-language="es"></div>

    <button type="submit">Enviar Formulario</button>
    <div id="mensaje-estado"></div>
  </form>
</div>

<script>
  document.getElementById('miFormulario').addEventListener('submit', function(event) {
    event.preventDefault();
    const estado = document.getElementById('mensaje-estado');
    
    // Obtenemos el token generado por Cloudflare Turnstile
    const token = turnstile.getResponse();

    if (!token) {
      estado.style.color = '#dc2626';
      estado.textContent = '⚠️ Por favor, completa la verificación de seguridad.';
      return;
    }

    // Si hay token válido en el cliente:
    estado.style.color = '#16a34a';
    estado.textContent = '✅ ¡Verificación humana exitosa! Formulario enviado.';
    
    // Opcional: reiniciar el formulario y el widget tras 3 segundos
    setTimeout(() => {
      this.reset();
      turnstile.reset();
      estado.textContent = '';
    }, 3000);
  });
</script>

</body>
</html>
